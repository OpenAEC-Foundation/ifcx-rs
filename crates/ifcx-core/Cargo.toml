[package]
name = "ifcx-core"
description = "IFCX (IFC5 JSON) parser, document model, ECS store, and query engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
hecs = { workspace = true }
rayon = { workspace = true }

# memory-mapped reading is for native builds; the browser (wasm32) has no files to map
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = { workspace = true }

# in the browser a new id takes its randomness from the JavaScript host
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

# sonic-rs for SIMD JSON parsing — uncomment when stabilized
# sonic-rs = { workspace = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "parser"
harness = false
